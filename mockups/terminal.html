<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terminal Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  html, body { height: 100%; margin: 0; background: #060605; overflow: hidden; font-family: VT323, monospace; }
  .page { position: fixed; inset: 0; display: flex; padding: 10px; }
  .bezel { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; background: linear-gradient(160deg, #2b2822, #1a1814 40%, #100f0c); padding: clamp(6px, 2vw, 24px) clamp(6px, 2.2vw, 26px) clamp(20px, 2.6vw, 32px); border-radius: clamp(10px, 2vw, 22px); box-shadow: inset 0 2px 0 #3a362e, inset 0 -3px 8px #000, 0 30px 80px #000; }
  .glass { flex: 1; min-height: 0; position: relative; overflow: hidden; background: #000; border-radius: 18px / 16px; box-shadow: inset 0 0 40px #000, 0 0 0 3px #050504; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
  .badge { position: absolute; bottom: 7px; left: 30px; letter-spacing: 0.3em; font-size: 11px; color: #5d574a; text-transform: uppercase; }
  .led { position: absolute; bottom: 10px; right: 30px; width: 6px; height: 6px; border-radius: 50%; background: #ff4a3a; box-shadow: 0 0 8px #ff4a3a; }
</style>
<div class="page">
  <div class="bezel">
    <div class="glass" id="glass"><canvas id="crt"></canvas></div>
    <div class="badge">Kessel Co. // MU-7 video terminal</div>
    <div class="led"></div>
  </div>
</div>
<script type="module" src="./terminal.ts"></script>
